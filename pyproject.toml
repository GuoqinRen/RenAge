[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renage"
version = "1.0.0"
description = "Cross-platform inference for the RenAge pan-tissue epigenetic clock"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Guoqin Ren"}]
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "torch>=2.6,<3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[project.scripts]
renage = "renage.cli:main"

[project.urls]
Repository = "https://github.com/GuoqinRen/RenAge"

[tool.setuptools.packages.find]
where = ["src"]
